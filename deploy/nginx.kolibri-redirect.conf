# Cloudflare routes kolibri.alignment.id to the Gray origin. Keep this vhost
# there so the legacy hostname redirects before the app handles a request.

server {
    listen 80;
    server_name kolibri.alignment.id;
    return 301 https://kolibrai.com$request_uri;
}

server {
    listen 443 ssl;
    server_name kolibri.alignment.id;

    # Reuse the origin certificate already used by the Gray vhosts.
    ssl_certificate /etc/letsencrypt/live/gray.alignment.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gray.alignment.id/privkey.pem;

    return 301 https://kolibrai.com$request_uri;
}
