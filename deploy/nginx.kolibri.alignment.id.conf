map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kolibri_node {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kolibri.alignment.id kolibrai.com www.kolibrai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($host = kolibri.alignment.id) {
            return 301 https://kolibrai.com$request_uri;
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kolibri.alignment.id kolibrai.com www.kolibrai.com;

    ssl_certificate /etc/letsencrypt/live/kolibrai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolibrai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16k;

    # The vendored three.js build is the largest asset on the page; compress it.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript image/svg+xml text/plain application/json;

    location / {
        if ($host = kolibri.alignment.id) {
            return 301 https://kolibrai.com$request_uri;
        }
        proxy_pass http://kolibri_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
